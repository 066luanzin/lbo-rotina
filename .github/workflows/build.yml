name: Gerar IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  VERSAO_BASE: "1.6"

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Testar o interpretador de voz (datas e horários)
        run: |
          cat Rotina/Interpretador.swift Testes/TesteInterpretador.swift > /tmp/teste.swift
          set +e
          TZ=America/Sao_Paulo swift /tmp/teste.swift > /tmp/saida.txt 2>&1
          status=$?
          cat /tmp/saida.txt
          # Falhas viram avisos públicos (dá pra ler sem login pela API do GitHub)
          if [ $status -ne 0 ]; then
            grep -E "error:|FALHOU|esperado|falharam" /tmp/saida.txt | head -40 | while IFS= read -r linha; do echo "::error::$linha"; done
          fi
          exit $status

      - name: Usar o Xcode 26 (precisa pro alarme do iOS 26)
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XC" ]; then echo "Xcode 26 não encontrado:"; ls /Applications | grep -i xcode; exit 1; fi
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Gerar projeto Xcode
        run: xcodegen generate

      - name: Compilar (sem assinatura, o AltStore assina)
        run: |
          xcodebuild -project Rotina.xcodeproj -scheme Rotina \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            MARKETING_VERSION="$VERSAO_BASE.${{ github.run_number }}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1 || { grep -E "error:" build.log | sort -u | head -40 | sed "s/^/::error::/"; tail -30 build.log; exit 1; }

      - name: Empacotar .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Rotina.app Payload/
          zip -qry LBO-Rotina.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: LBO-Rotina-ipa
          path: LBO-Rotina.ipa

      - name: Publicar versão e atualizar a fonte do AltStore
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="$VERSAO_BASE.${{ github.run_number }}"
          TAG="v$VER"
          NOTAS=$(git log -1 --pretty=%s)
          python3 scripts/fonte_altstore.py "$VER" "${{ github.run_number }}" "$TAG" "$(stat -f%z LBO-Rotina.ipa)" "$NOTAS" > altstore.json
          gh release create "$TAG" LBO-Rotina.ipa altstore.json --title "LBO Rotina $VER" --notes "$NOTAS" --latest
